<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>تجربة نطق نزيه</title>
<style>
  body{margin:0;background:#f4eee6;color:#17261c;font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.8}
  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:22px;color:#1B5E20;margin:0 0 4px}
  h2{font-size:18px;color:#1B5E20;margin:26px 0 6px}
  p{margin:6px 0;color:#52514e;font-size:15px}
  .card{background:#fff;border:1px solid #e1e0d9;border-radius:14px;padding:16px;margin-top:10px}
  textarea{width:100%;box-sizing:border-box;min-height:110px;font:inherit;border:1px solid #c3c2b7;border-radius:10px;padding:10px;resize:vertical}
  button{font:inherit;font-weight:600;border-radius:10px;border:1px solid #1B5E20;background:#1B5E20;color:#fff;padding:9px 18px;cursor:pointer;margin:6px 0 0 6px}
  button.ghost{background:#fff;color:#1B5E20}
  button:disabled{opacity:.5}
  .opt{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee}
  .opt:last-child{border-bottom:0}
  .opt b{min-width:28px;height:28px;border-radius:50%;background:#e6f1e7;color:#1B5E20;display:grid;place-items:center}
  .opt span{flex:1}
  .opt button{margin:0;padding:6px 16px}
  #msg{min-height:26px;color:#b3261e;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <h1>تجربة نطق نزيه</h1>
  <p>صفحة لك أنت فقط (ما تظهر للزوار). اكتب أي جملة واسمعها بصوت نزيه قبل ما تعتمدها.</p>

  <h2>١. لفظ الجلالة</h2>
  <p>اضغط كل رقم واسمع، ثم قل لي أي رقم نطق «الله» مفخّمة صح.</p>
  <div class="card" id="opts"></div>

  <h2>٢. جرّب أي جملة</h2>
  <div class="card">
    <textarea id="txt">حياك الله في اليوم العالمي لمكافحة الفساد. إن شاء الله تستفيد، وبسم الله نبدأ.</textarea>
    <button id="say">اسمع (مثل ما ينطقها نزيه)</button>
    <button id="raw" class="ghost">اسمع النص كما هو بدون معالجة</button>
    <p id="msg"></p>
    <p>إذا سمعت كلمة تُنطق غلط، اكتبها لي مع النطق الصحيح وأضبطها.</p>
  </div>
</div>
<script>
(() => {
  const $ = (s) => document.querySelector(s), msg = $('#msg');
  const SAMPLE = 'حياك الله، ما شاء الله عليك، وإن شاء الله تستفيد من الفعالية.';
  const NAMES = ['بدون تغيير (كما كان)', 'الطريقة ١', 'الطريقة ٢ (المعتمدة حالياً إن لم تغيّرها)', 'الطريقة ٣', 'الطريقة ٤', 'الطريقة ٥'];
  let audio = null;
  async function play(body, btn) {
    msg.textContent = ''; if (audio) { audio.pause(); audio = null; }
    btn.disabled = true;
    try {
      const r = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'تعذّر توليد الصوت');
      audio = new Audio(URL.createObjectURL(await r.blob())); await audio.play();
    } catch (e) { msg.textContent = e.message; }
    btn.disabled = false;
  }
  $('#opts').innerHTML = `<p style="margin-top:0">الجملة: «${SAMPLE}»</p>` + NAMES.map((n, i) => `<div class="opt"><b>${i}</b><span>${n}</span><button data-i="${i}">اسمع</button></div>`).join('');
  $('#opts').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) play({ text: SAMPLE, allah: Number(b.dataset.i) }, b); });
  $('#say').addEventListener('click', (e) => { const t = $('#txt').value.trim(); if (t) play({ text: t }, e.target); });
  $('#raw').addEventListener('click', (e) => { const t = $('#txt').value.trim(); if (t) play({ text: t, raw: true }, e.target); });
})();
</script>
</body>
</html>
